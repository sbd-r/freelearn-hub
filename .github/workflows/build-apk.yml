name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy web files
        run: |
          mkdir -p www
          cp index.html data.js data2.js data3.js manifest.json sw.js icon-192.png icon-512.png www/

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add AdMob App ID to Android manifest
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5053693807902862~4627902805"/>\n    '
          assert "</application>" in s, "application tag not found"
          s = s.replace("</application>", meta + "</application>", 1)
          open(p, "w").write(s)
          print("AdMob App ID added")
          PY

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: freelearn-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
