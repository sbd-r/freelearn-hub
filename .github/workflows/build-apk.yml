name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the website files (sbd-r/freelearnhub)
        uses: actions/checkout@v4
        with:
          repository: sbd-r/freelearnhub
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files for the app
        env:
          RUN: ${{ github.run_number }}
        run: |
          mkdir -p www
          cp -r site/. www/
          rm -rf www/.git www/.github
          printf 'window.FL_BUILD=%s;\n' "$RUN" | cat - native.js > www/native.js
          python3 - <<'PY'
          import glob
          for p in glob.glob("www/**/*.html", recursive=True):
              s = open(p, encoding="utf-8").read()
              # the page script can contain the text </body> inside a string, so use the LAST one
              if "native.js" not in s and "</body>" in s:
                  i = s.rfind("</body>")
                  s = s[:i] + '<script src="native.js"></script>\n' + s[i:]
              open(p, "w", encoding="utf-8").write(s)
          print("pages prepared")
          PY

      - name: Create Android project
        run: npx cap add android

      - name: Icon and splash screen
        run: |
          pip install pillow
          python3 make_icons.py

      - name: Sync web files
        run: npx cap sync android

      - name: AdMob App ID and version number
        env:
          RUN: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5053693807902862~4627902805"/>\n    '
          assert "</application>" in s, "application tag not found"
          if "APPLICATION_ID" not in s:
              s = s.replace("</application>", meta + "</application>", 1)
          open(p, "w").write(s)
          g = "android/app/build.gradle"
          t = open(g).read()
          n = os.environ["RUN"]
          t = re.sub(r"versionCode \d+", "versionCode " + n, t, count=1)
          t = re.sub(r'versionName "[^"]*"', 'versionName "1.1.' + n + '"', t, count=1)
          open(g, "w").write(t)
          print("manifest and version updated")
          PY

      - name: Build
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi

      - name: Sign release APK
        if: env.KS_B64 != ''
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > release.jks
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KS_PASS --out freelearn-release.apk aligned.apk
          "$BT/apksigner" verify --verbose freelearn-release.apk | head -4
          rm -f release.jks aligned.apk

      - name: Upload signed APK
        if: env.KS_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: freelearn-apk
          path: freelearn-release.apk

      - name: Publish download link (GitHub Release)
        if: env.KS_B64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FreeLearn Hub ${{ github.run_number }}
          make_latest: true
          files: freelearn-release.apk

      - name: Upload debug APK (no signing key set yet)
        if: env.KS_B64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: freelearn-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
