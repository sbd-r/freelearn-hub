<!doctype html>
<html lang="bn" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ফ্রিলার্ন হাব</title>
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Free courses, open books and free software from around the world.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f8f8; --card:#ffffff; --ink:#14201f; --muted:#5b6b69; --line:#dfe7e6;
  --brand:#0f766e; --brand-ink:#ffffff; --chip:#e6f2f0; --warn:#b45309; --star:#d97706;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1514; --card:#162120; --ink:#e8f0ef; --muted:#9bb0ad; --line:#26373531; --line:#263735; --brand:#2dd4bf; --brand-ink:#04211e; --chip:#1b2e2c; --star:#fbbf24; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Noto Sans Devanagari","Noto Nastaliq Urdu",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.top{display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;opacity:.9;margin-top:2px}
select,.iconbtn{background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
select option{color:#111}
.iconbtn{min-width:40px;cursor:pointer}
.iconbtn[aria-pressed="true"]{background:#fff;color:#b45309}
.search{margin-top:10px}
.search input{width:100%;border:0;border-radius:12px;padding:12px 14px;font:inherit;background:#fff;color:#111}
nav.tabs{display:flex;gap:6px;padding:12px 16px 0}
nav.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 6px;border-radius:12px;font:inherit;font-size:15px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
nav.tabs small{opacity:.75;font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;background:var(--chip);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
main{padding:0 16px 24px;max-width:760px;margin:0 auto}
.count{color:var(--muted);font-size:13px;margin:0 2px 8px}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;margin-bottom:10px;cursor:pointer}
.card:active{transform:scale(.995)}
.info{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.meta .c{background:var(--chip);border-radius:6px;padding:0 7px}
.star{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:6px}
.star[aria-pressed="true"]{color:var(--star)}
.go{border:0;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;flex:none}
.more{display:block;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{color:var(--muted);font-size:12px;text-align:center;padding:8px 20px 28px;max-width:760px;margin:0 auto}
/* ad overlay */
.ad{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.ad[hidden]{display:none}
.adbox{position:relative;background:var(--card);color:var(--ink);border-radius:18px;padding:18px;width:100%;max-width:360px;text-align:center}
.adtag{font-size:12px;color:var(--muted);text-align:start;margin-bottom:8px}
.adslot{min-height:250px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;overflow:hidden}
.adnote{font-size:12px;color:var(--muted);margin:10px 0}
.adgo{width:100%;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:600;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.adgo:disabled{opacity:.5;cursor:default}
.adx{position:absolute;top:6px;inset-inline-end:8px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;padding:6px}
[dir="rtl"] .adtag{text-align:start}
</style>
</head>
<body>
<header>
  <div class="top">
    <div style="min-width:0;flex:1">
      <div class="logo" id="appName"></div>
      <div class="tag" id="tagline"></div>
    </div>
    <button class="iconbtn" id="savedBtn" aria-pressed="false" aria-label="Saved">★</button>
    <select id="lang" aria-label="Language">
      <option value="bn">বাংলা</option>
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="ur">اردو</option>
    </select>
  </div>
  <div class="search"><input id="q" type="search" autocomplete="off"></div>
</header>

<nav class="tabs" id="tabs" role="tablist"></nav>
<div class="chips" id="chips"></div>
<main>
  <p class="count" id="count"></p>
  <div id="list"></div>
  <button class="more" id="more" hidden></button>
</main>
<footer id="disc"></footer>

<div class="ad" id="ad" hidden>
  <div class="adbox" role="dialog" aria-modal="true">
    <button class="adx" id="adx" aria-label="Close">×</button>
    <div class="adtag" id="adtag"></div>
    <!-- AD SLOT: put your AdSense / ad network code inside this div. For AdMob (native Android) this slot is not used. -->
    <div class="adslot" id="adslot">AD · 300×250</div>
    <p class="adnote" id="adnote"></p>
    <button class="adgo" id="adgo" disabled></button>
  </div>
</div>

<script src="data.js"></script>
<script>
"use strict";
/* ================= AD SETTINGS ================= */
const AD = {
  everyN: 1,              // show an ad before every Nth open (1 = every time)
  seconds: 5,             // wait before "Continue" becomes active
  admobInterstitialId: "",// your AdMob interstitial unit ID (native Android wrapper only)
  // Uses Capacitor AdMob plugin if present; otherwise falls back to the on-screen ad slot.
  async tryNative(){
    const P = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob;
    if(!P || !AD.admobInterstitialId) return false;
    try{ await P.prepareInterstitial({adId: AD.admobInterstitialId}); await P.showInterstitial(); return true; }
    catch(e){ return false; }
  }
};

/* ================= TEXT ================= */
const T = {
 bn:{app:"ফ্রিলার্ন হাব",tag:"বিশ্বের ফ্রি কোর্স, বই ও সফটওয়্যার এক জায়গায়",search:"খুঁজুন…",c:"কোর্স",b:"বই",s:"সফটওয়্যার",all:"সব",open:"খুলুন",ad:"বিজ্ঞাপন",wait:"{n} সেকেন্ড পরে চালিয়ে যেতে পারবেন",go:"চালিয়ে যান",note:"বিজ্ঞাপন এই সেবা ফ্রি রাখতে সাহায্য করে।",count:"{n}টি ফলাফল",none:"কিছু পাওয়া যায়নি",more:"আরও দেখুন",disc:"সব লিংক তৃতীয় পক্ষের অফিসিয়াল সাইটে যায়। কিছু কোর্সে সার্টিফিকেটের জন্য ফি লাগতে পারে।",nosaved:"এখনো কিছু সেভ করা হয়নি"},
 en:{app:"FreeLearn Hub",tag:"Free courses, books & software from around the world",search:"Search…",c:"Courses",b:"Books",s:"Software",all:"All",open:"Open",ad:"Advertisement",wait:"You can continue in {n}s",go:"Continue",note:"Ads help keep this service free.",count:"{n} results",none:"Nothing found",more:"Show more",disc:"All links go to the official third-party sites. Some courses may charge for certificates.",nosaved:"Nothing saved yet"},
 hi:{app:"फ्रीलर्न हब",tag:"दुनिया भर के मुफ़्त कोर्स, किताबें और सॉफ़्टवेयर एक जगह",search:"खोजें…",c:"कोर्स",b:"किताबें",s:"सॉफ़्टवेयर",all:"सभी",open:"खोलें",ad:"विज्ञापन",wait:"{n} सेकंड बाद आगे बढ़ सकते हैं",go:"आगे बढ़ें",note:"विज्ञापन इस सेवा को मुफ़्त रखने में मदद करते हैं।",count:"{n} परिणाम",none:"कुछ नहीं मिला",more:"और देखें",disc:"सभी लिंक तीसरे पक्ष की आधिकारिक साइटों पर जाते हैं। कुछ कोर्स में सर्टिफ़िकेट के लिए शुल्क लग सकता है।",nosaved:"अभी कुछ सेव नहीं किया"},
 ur:{app:"فری لرن حب",tag:"دنیا بھر کے مفت کورسز، کتابیں اور سافٹ ویئر ایک جگہ",search:"تلاش کریں…",c:"کورسز",b:"کتابیں",s:"سافٹ ویئر",all:"سب",open:"کھولیں",ad:"اشتہار",wait:"{n} سیکنڈ بعد آگے بڑھ سکتے ہیں",go:"آگے بڑھیں",note:"اشتہارات اس سروس کو مفت رکھنے میں مدد کرتے ہیں۔",count:"{n} نتائج",none:"کچھ نہیں ملا",more:"مزید دیکھیں",disc:"تمام لنک تیسرے فریق کی سرکاری سائٹس پر جاتے ہیں۔ بعض کورسز میں سرٹیفکیٹ کے لیے فیس ہو سکتی ہے۔",nosaved:"ابھی کچھ محفوظ نہیں کیا"}
};
const CAT = {
 prog:{bn:"প্রোগ্রামিং",en:"Programming",hi:"प्रोग्रामिंग",ur:"پروگرامنگ"},
 ai:{bn:"এআই ও ডেটা",en:"AI & Data",hi:"एआई और डेटा",ur:"اے آئی اور ڈیٹا"},
 math:{bn:"গণিত",en:"Math",hi:"गणित",ur:"ریاضی"},
 sci:{bn:"বিজ্ঞান",en:"Science",hi:"विज्ञान",ur:"سائنس"},
 biz:{bn:"ব্যবসা ও মার্কেটিং",en:"Business & Marketing",hi:"व्यापार और मार्केटिंग",ur:"کاروبار اور مارکیٹنگ"},
 lang:{bn:"ভাষা",en:"Languages",hi:"भाषाएँ",ur:"زبانیں"},
 design:{bn:"ডিজাইন",en:"Design",hi:"डिज़ाइन",ur:"ڈیزائن"},
 health:{bn:"স্বাস্থ্য",en:"Health",hi:"स्वास्थ्य",ur:"صحت"},
 hum:{bn:"মানবিক ও রেফারেন্স",en:"Humanities & Reference",hi:"मानविकी और संदर्भ",ur:"انسانیات اور حوالہ"},
 sec:{bn:"সাইবার নিরাপত্তা",en:"Cybersecurity",hi:"साइबर सुरक्षा",ur:"سائبر سیکیورٹی"},
 univ:{bn:"বিশ্ববিদ্যালয় ও প্ল্যাটফর্ম",en:"Universities & Platforms",hi:"विश्वविद्यालय और प्लेटफ़ॉर्म",ur:"جامعات اور پلیٹ فارم"},
 reg:{bn:"আঞ্চলিক",en:"Regional",hi:"क्षेत्रीय",ur:"علاقائی"},
 lib:{bn:"ওপেন লাইব্রেরি",en:"Open Libraries",hi:"ओपन लाइब्रेरी",ur:"اوپن لائبریریاں"},
 text:{bn:"পাঠ্যবই",en:"Textbooks",hi:"पाठ्यपुस्तकें",ur:"درسی کتب"},
 os:{bn:"অপারেটিং সিস্টেম",en:"Operating Systems",hi:"ऑपरेटिंग सिस्टम",ur:"آپریٹنگ سسٹم"},
 office:{bn:"অফিস ও প্রোডাক্টিভিটি",en:"Office & Productivity",hi:"ऑफ़िस और उत्पादकता",ur:"آفس اور پیداواریت"},
 media:{bn:"ভিডিও ও অডিও",en:"Video & Audio",hi:"वीडियो और ऑडियो",ur:"ویڈیو اور آڈیو"},
 gfx:{bn:"গ্রাফিক্স ও 3D",en:"Graphics & 3D",hi:"ग्राफ़िक्स और 3D",ur:"گرافکس اور 3D"},
 dev:{bn:"ডেভেলপমেন্ট",en:"Development",hi:"डेवलपमेंट",ur:"ڈویلپمنٹ"},
 util:{bn:"টুলস",en:"Utilities",hi:"उपयोगी टूल",ur:"ٹولز"},
 edu:{bn:"শিক্ষা",en:"Education",hi:"शिक्षा",ur:"تعلیم"}
};
// books use "sec"/"hum" labels too; software "sec" shown as Security via override
const CAT_S_SEC = {bn:"নিরাপত্তা",en:"Security",hi:"सुरक्षा",ur:"سیکیورٹی"};

/* ================= STATE ================= */
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
const guess = () => { const n=(navigator.language||"bn").slice(0,2); return T[n]?n:"bn"; };
const S = { lang: store("lang")||guess(), type:"c", cat:"all", q:"", savedOnly:false, shown:40, opens:0 };
let saved = []; try{ saved = JSON.parse(store("saved")||"[]"); }catch(e){ saved=[]; }
const $ = id => document.getElementById(id);
const tr = k => T[S.lang][k];
const catLabel = (type,c) => (type==="s" && c==="sec") ? CAT_S_SEC[S.lang] : CAT[c][S.lang];
const host = u => { try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return u; } };

/* ================= RENDER ================= */
function applyLang(){
  const l=S.lang;
  document.documentElement.lang=l;
  document.documentElement.dir = l==="ur" ? "rtl" : "ltr";
  document.title=tr("app");
  $("appName").textContent=tr("app");
  $("tagline").textContent=tr("tag");
  $("q").placeholder=tr("search");
  $("disc").textContent=tr("disc");
  $("lang").value=l;
  $("adtag").textContent=tr("ad");
  $("adnote").textContent=tr("note");
  $("more").textContent=tr("more");
  store("lang",l);
}
function renderTabs(){
  const counts={c:0,b:0,s:0}; ITEMS.forEach(i=>counts[i[0]]++);
  $("tabs").innerHTML = ["c","b","s"].map(t=>
    `<button role="tab" data-type="${t}" aria-selected="${!S.savedOnly && S.type===t}">${tr(t)}<br><small>${counts[t]}</small></button>`).join("");
}
function renderChips(){
  if(S.savedOnly){ $("chips").innerHTML=""; return; }
  const cats=[]; ITEMS.forEach(i=>{ if(i[0]===S.type && !cats.includes(i[1])) cats.push(i[1]); });
  $("chips").innerHTML = [`<button data-cat="all" aria-pressed="${S.cat==="all"}">${tr("all")}</button>`]
    .concat(cats.map(c=>`<button data-cat="${c}" aria-pressed="${S.cat===c}">${catLabel(S.type,c)}</button>`)).join("");
}
function filtered(){
  const q=S.q.trim().toLowerCase();
  return ITEMS.map((it,idx)=>({it,idx})).filter(({it})=>{
    if(S.savedOnly){ if(!saved.includes(it[3])) return false; }
    else { if(it[0]!==S.type) return false; if(S.cat!=="all" && it[1]!==S.cat) return false; }
    if(!q) return true;
    return (it[2]+" "+host(it[3])+" "+catLabel(it[0],it[1])).toLowerCase().includes(q);
  });
}
function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function renderList(){
  const res=filtered();
  $("count").textContent = res.length ? tr("count").replace("{n}",res.length) : "";
  if(!res.length){
    $("list").innerHTML=`<div class="empty">${S.savedOnly && !S.q ? tr("nosaved") : tr("none")}</div>`;
    $("more").hidden=true; return;
  }
  const part=res.slice(0,S.shown);
  $("list").innerHTML = part.map(({it,idx})=>{
    const on=saved.includes(it[3]);
    return `<div class="card" data-idx="${idx}">
      <div class="info"><div class="name">${esc(it[2])}</div>
        <div class="meta"><span class="c">${esc(catLabel(it[0],it[1]))}</span><span dir="ltr">${esc(host(it[3]))}</span></div></div>
      <button class="star" data-star="${idx}" aria-pressed="${on}" aria-label="Save">${on?"★":"☆"}</button>
      <button class="go" data-go="${idx}">${tr("open")}</button></div>`;
  }).join("");
  $("more").hidden = res.length<=S.shown;
}
function renderAll(){ applyLang(); renderTabs(); renderChips(); renderList(); $("savedBtn").setAttribute("aria-pressed",S.savedOnly); }

/* ================= OPEN FLOW (ad first, then link) ================= */
let pendingUrl=null, timer=null;
function openUrl(u){ const w=window.open(u,"_blank","noopener"); if(!w) location.href=u; }
async function openItem(idx){
  const url=ITEMS[idx][3];
  S.opens++;
  if(S.opens % AD.everyN !== 0){ openUrl(url); return; }
  if(await AD.tryNative()){ openUrl(url); return; }
  showAd(url);
}
function showAd(url){
  pendingUrl=url;
  let n=AD.seconds;
  const btn=$("adgo");
  btn.disabled=true; btn.textContent=tr("wait").replace("{n}",n);
  $("ad").hidden=false;
  clearInterval(timer);
  timer=setInterval(()=>{
    n--;
    if(n<=0){ clearInterval(timer); btn.disabled=false; btn.textContent=tr("go"); }
    else btn.textContent=tr("wait").replace("{n}",n);
  },1000);
}
function closeAd(){ clearInterval(timer); $("ad").hidden=true; pendingUrl=null; }
$("adgo").onclick=()=>{ const u=pendingUrl; closeAd(); if(u) openUrl(u); };
$("adx").onclick=closeAd;

/* ================= EVENTS ================= */
$("lang").onchange=e=>{ S.lang=e.target.value; renderAll(); };
$("q").oninput=e=>{ S.q=e.target.value; S.shown=40; renderList(); };
$("savedBtn").onclick=()=>{ S.savedOnly=!S.savedOnly; S.shown=40; renderAll(); };
$("tabs").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; S.type=b.dataset.type; S.cat="all"; S.savedOnly=false; S.shown=40; renderAll(); };
$("chips").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; S.cat=b.dataset.cat; S.shown=40; renderChips(); renderList(); };
$("more").onclick=()=>{ S.shown+=40; renderList(); };
$("list").onclick=e=>{
  const st=e.target.closest("[data-star]");
  if(st){
    e.stopPropagation();
    const u=ITEMS[+st.dataset.star][3];
    saved = saved.includes(u) ? saved.filter(x=>x!==u) : saved.concat(u);
    store("saved",JSON.stringify(saved));
    renderList(); return;
  }
  const card=e.target.closest(".card");
  if(card) openItem(+card.dataset.idx);
};

renderAll();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
